# Draait de tests bij elke push en pull request. De tests gebruiken geen
# netwerk (vaste voorbeelden in tests/testthat/fixtures), dus ze belasten de
# API van OpenBesluitvorming niet. Controleert ook of manifest.json (voor
# Posit Connect Cloud) nog bij de code past.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Systeembibliotheken voor sf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: R-pakketten installeren
        run: |
          Rscript -e 'install.packages(c("shiny", "bslib", "httr2", "jsonlite", "dplyr", "tidyr", "leaflet", "ggplot2", "ggrepel", "cbsodataR", "sf", "cachem", "rlang", "mirai", "testthat", "withr"))'

      - name: Tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
