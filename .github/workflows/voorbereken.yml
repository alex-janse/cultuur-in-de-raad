# Rekent elke nacht de standaardzoekvragen, CBS-cijfers en gemeentegrenzen
# uit en zet ze op de tak 'data'. De app leest die eerst, zodat hij direct
# laadt en de API van OpenBesluitvorming minder belast.
name: Voorberekenen

on:
  schedule:
    - cron: "17 2 * * *"   # elke nacht om 02:17 UTC
  workflow_dispatch:        # handmatig starten via het tabblad Actions
    inputs:
      cbs_opnieuw:
        description: "CBS-cijfers en gemeentegrenzen opnieuw ophalen, ook als ze niet gewijzigd zijn"
        type: boolean
        default: false
      oude_bewaren:
        description: "Oude zoekresultaten laten staan (bij de overgang naar een nieuwe versie van de app)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: voorbereken
  cancel-in-progress: false

jobs:
  voorbereken:
    runs-on: ubuntu-latest
    # Het script start na 75 minuten geen nieuwe zoekvragen meer (TIJDBUDGET_MINUTEN)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # De token niet in .git/config laten staan: alleen de publiceerstap
          # krijgt schrijfrechten
          persist-credentials: false

      # Zonder de vorige data zou de force-push hieronder alles wissen wat deze
      # nacht niet lukt. Alleen als de tak echt nog niet bestaat (eerste run)
      # beginnen we leeg; elke andere fout stopt de run.
      - name: Vorige data ophalen (blijft staan als iets mislukt)
        run: |
          set -o pipefail
          mkdir -p uitvoer
          status=0
          git ls-remote --exit-code --heads origin data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C uitvoer
            test -f uitvoer/overzicht.csv || { echo "::error::overzicht.csv ontbreekt op de tak data"; exit 1; }
          elif [ "$status" -eq 2 ]; then
            echo "::warning::De tak data bestaat nog niet; de eerste run begint leeg."
          else
            echo "::error::De tak data kon niet worden gecontroleerd (git ls-remote gaf $status)."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          # Dezelfde R-versie als de app op Connect (manifest.json, "platform")
          r-version: "4.6.1"
          use-public-rspm: true

      # Pakketten bewaren tussen runs: voor R 4.6.1 moet o.a. s2 (voor sf) anders
      # elke keer vanaf de broncode worden gebouwd (~7 min). Eén keer per maand
      # vers installeren, zodat updates doorkomen.
      - name: Maand bepalen (voor de pakketcache)
        id: datum
        run: echo "maand=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pakketten-${{ runner.os }}-4.6.1-${{ hashFiles('.github/workflows/voorbereken.yml') }}-${{ steps.datum.outputs.maand }}

      - name: Systeembibliotheken voor sf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: R-pakketten installeren
        run: |
          Rscript -e 'p <- c("shiny", "httr2", "jsonlite", "dplyr", "tidyr", "leaflet", "ggplot2", "ggrepel", "cbsodataR", "sf", "cachem", "rlang"); nieuw <- p[!vapply(p, requireNamespace, logical(1), quietly = TRUE)]; if (length(nieuw) > 0) install.packages(nieuw)'

      - name: Voorberekenen
        run: Rscript scripts/voorbereken.R uitvoer
        env:
          CBS_OPNIEUW: ${{ inputs.cbs_opnieuw }}
          OUDE_BEWAREN: ${{ inputs.oude_bewaren }}

      - name: Publiceren op tak 'data'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd uitvoer
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Voorberekende data $(date -u +%F)"
          # Alleen de laatste versie bewaren, zodat de repository klein blijft
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Archieven zonder CBS-gemeente melden
        run: |
          if [ -f onbekend.txt ]; then
            echo "::warning::Archieven zonder CBS-gemeente (vul FUSIES of CBS_NAAM_NAAR_KEY aan in R/config.R): $(paste -sd, onbekend.txt)"
          fi

      - name: Bronnen die niet te controleren waren melden
        run: |
          if [ -f niet_gecontroleerd.txt ]; then
            echo "::warning::Niet te controleren op nieuwe cijfers (bron onbereikbaar; de vorige versie blijft staan): $(paste -sd, niet_gecontroleerd.txt)"
          fi

      - name: Controle op onderdelen die niet zijn bijgewerkt
        run: |
          if [ -f mislukt.txt ]; then
            echo "::error::Niet alles is bijgewerkt (de vorige versie blijft staan):"
            cat mislukt.txt
            exit 1
          fi
